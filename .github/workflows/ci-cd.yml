name: Pipeline CI/CD CRM Culturizarte

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  pruebas-y-migraciones:
    runs-on: ubuntu-latest
    
    # Crea una base de datos PostgreSQL temporal solo para que GitHub haga las pruebas
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testing_db
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Configurar entorno PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo_pgsql, pgsql

    - name: Instalar dependencias de Laravel
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Preparar archivo .env para pruebas
      run: |
        cp .env.example .env
        # Se quitan las líneas DB_* de ejemplo y se apunta al PostgreSQL temporal del job,
        # con las mismas opciones de conexión que se usan con Supabase.
        sed -i '/^#\? *DB_/d' .env
        cat >> .env <<'EOF'
        DB_CONNECTION=pgsql
        DB_HOST=127.0.0.1
        DB_PORT=5432
        DB_DATABASE=testing_db
        DB_USERNAME=root
        DB_PASSWORD=root
        DB_DISABLE_PREPARES=true
        EOF
        grep '^DB_CONNECTION=pgsql' .env

    - name: Generar Key de Laravel
      run: php artisan key:generate

    - name: Test de migraciones (Integridad de la base de datos)
      run: php artisan migrate --force --env=testing

    # Las vistas usan @vite: sin public/build/manifest.json responden 500.
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Compilar assets (Vite)
      run: |
        npm ci
        npm run build

    - name: Pruebas unitarias
      run: php artisan test